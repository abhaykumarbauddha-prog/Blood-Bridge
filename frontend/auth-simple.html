<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bridge | Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #F5F7FA; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #E60023; }
        .form-control { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #E60023; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #DC2626; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 0.9em; cursor: pointer; color: #2563EB; }
        
        /* Role Buttons */
        .role-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .role-btn { flex: 1; padding: 8px; border: 1px solid #E60023; background: white; color: #E60023; cursor: pointer; border-radius: 5px; }
        .role-btn:focus { background: #E60023; color: white; }

        #signup-view { display: none; } /* Default hide signup */
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- Login Form -->
        <div id="login-view">
            <h2>Login to Blood Bridge</h2>
            <form>
                <input type="email" class="form-control" placeholder="Email" required>
                <input type="password" class="form-control" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="toggle-text" onclick="toggleView('signup')">Don't have an account? Sign Up</div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-view">
            <h2>Create an Account</h2>
            
            <div class="role-selector">
                <button class="role-btn">Donor</button>
                <button class="role-btn">Requester</button>
                <button class="role-btn">Hospital</button>
            </div>

            <form>
                <input type="text" class="form-control" placeholder="Full Name" required>
                <input type="email" class="form-control" placeholder="Email" required>
                <input type="text" class="form-control" placeholder="Phone Number" required>
                <input type="password" class="form-control" placeholder="Password" required>
                <input type="password" class="form-control" placeholder="Confirm Password" required>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="toggle-text" onclick="toggleView('login')">Already have an account? Login</div>
        </div>

    </div>

    <!-- Toggle Script for switching between Login and Signup -->
    <script>
        function toggleView(view) {
            document.getElementById('login-view').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('signup-view').style.display = view === 'signup' ? 'block' : 'none';
        }
    </script>

    <!-- Supabase CDN and Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile-sync.js"></script>

</body>
</html>
