<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bridge | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #E60023;
            --brand-hover: #C5001E;
            --bg-pink: #FFF0F2;
            --bg-white: #FFFFFF;
            --bg-light: #F8F9FA;
            --text-dark: #101828;
            --text-secondary: #475467;
            --border-color: #E4E7EC;
            --status-success: #12B76A;
            --status-critical: #D92D20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FFF0F2 0%, #FEE2E2 100%);
            padding: 20px;
        }

        .reset-card {
            background: var(--bg-white);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .logo-section span {
            color: var(--brand-primary);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px var(--bg-pink);
        }

        .btn-submit {
            width: 100%;
            background: var(--brand-primary);
            color: var(--bg-white);
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: var(--brand-hover);
        }

        .btn-submit:disabled {
            background: #FDA29B;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.4;
            display: none;
        }

        .status-box.info {
            display: block;
            background: #EFF8FF;
            color: #175CD3;
            border: 1px solid #B2DDFF;
        }

        .status-box.error {
            display: block;
            background: #FEF3F2;
            color: var(--status-critical);
            border: 1px solid #FECDCA;
        }

        .status-box.success {
            display: block;
            background: #ECFDF3;
            color: var(--status-success);
            border: 1px solid #A6F4C5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--brand-primary);
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <a href="index.html" class="logo-section">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#E60023">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            Blood<span>Bridge</span>
        </a>

        <div class="card-header">
            <h2 id="card-title">Reset Password</h2>
            <p id="card-desc">Enter your registered email address to receive a secure password reset link.</p>
        </div>

        <!-- FORM 1: SEND RESET LINK -->
        <form id="request-reset-form">
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input id="reset-email" type="email" class="form-control" placeholder="Enter your registered email" required autocomplete="email">
            </div>
            <button id="btn-send-link" type="submit" class="btn-submit">Send Reset Link →</button>
        </form>

        <!-- FORM 2: ENTER NEW PASSWORD (SHOWN WHEN RESET LINK CLICKED) -->
        <form id="update-password-form" style="display: none;">
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input id="new-password" type="password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input id="confirm-password" type="password" class="form-control" placeholder="Re-enter your new password" minlength="6" required autocomplete="new-password">
            </div>
            <button id="btn-update-password" type="submit" class="btn-submit">Set New Password →</button>
        </form>

        <!-- STATUS MESSAGE -->
        <div id="status-box" class="status-box"></div>

        <a href="auth.html?mode=login" class="back-link">← Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const client = window.bloodBridgeSupabase;
            const requestForm = document.getElementById('request-reset-form');
            const updateForm = document.getElementById('update-password-form');
            const emailInput = document.getElementById('reset-email');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const btnSendLink = document.getElementById('btn-send-link');
            const btnUpdatePassword = document.getElementById('btn-update-password');
            const statusBox = document.getElementById('status-box');
            const cardTitle = document.getElementById('card-title');
            const cardDesc = document.getElementById('card-desc');

            function showStatus(text, type = 'info') {
                statusBox.className = `status-box ${type}`;
                statusBox.textContent = text;
            }

            function switchToUpdateMode() {
                requestForm.style.display = 'none';
                updateForm.style.display = 'block';
                cardTitle.textContent = 'Set New Password';
                cardDesc.textContent = 'Please enter your new password below to update your account.';
                showStatus('Reset link verified! Please enter your new password.', 'info');
            }

            // 1. Check for errors in URL (hash or search)
            const rawHash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
            const hashParams = new URLSearchParams(rawHash);
            const searchParams = new URLSearchParams(window.location.search);

            const urlError = hashParams.get('error_description') || searchParams.get('error_description') || hashParams.get('error') || searchParams.get('error');
            if (urlError) {
                const cleanedError = decodeURIComponent(urlError.replace(/\+/g, ' '));
                showStatus(`Link Error: ${cleanedError}. Kripya niche apna email daalkar naya link generate karein.`, 'error');
            }

            // 2. Check for PKCE Code in URL search
            const authCode = searchParams.get('code');
            let isVerifiedSession = false;

            if (authCode) {
                showStatus('Verifying security code...', 'info');
                try {
                    const { data, error } = await client.auth.exchangeCodeForSession(authCode);
                    if (error) {
                        showStatus(`Code verification failed: ${error.message}`, 'error');
                    } else if (data?.session) {
                        isVerifiedSession = true;
                        switchToUpdateMode();
                    }
                } catch (codeErr) {
                    console.error('Code exchange error:', codeErr);
                }
            }

            // 3. Check for access_token in URL Hash
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            const flowType = hashParams.get('type');

            if (accessToken && flowType === 'recovery') {
                showStatus('Verifying security token...', 'info');
                try {
                    const { data, error } = await client.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || ''
                    });
                    if (!error && data?.session) {
                        isVerifiedSession = true;
                        switchToUpdateMode();
                    }
                } catch (tokErr) {
                    console.error('Set session error:', tokErr);
                }
            }

            // 4. Listen for PASSWORD_RECOVERY event from Supabase auth listener
            client.auth.onAuthStateChange(async (event, session) => {
                console.log('Reset Password Auth Event:', event);
                if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && flowType === 'recovery')) {
                    isVerifiedSession = true;
                    switchToUpdateMode();
                }
            });

            // 5. Check if already has active session with recovery flow
            if (!isVerifiedSession) {
                try {
                    const { data } = await client.auth.getSession();
                    if (data?.session && (flowType === 'recovery' || hashParams.has('access_token') || searchParams.has('code'))) {
                        isVerifiedSession = true;
                        switchToUpdateMode();
                    }
                } catch (_) {}
            }

            // ==========================================
            // ACTION 1: SEND RESET LINK
            // ==========================================
            requestForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                if (!email) {
                    showStatus('Please enter your email address.', 'error');
                    return;
                }

                btnSendLink.disabled = true;
                btnSendLink.textContent = 'Sending reset link... ⏳';

                try {
                    const redirectTo = `${window.location.origin}/reset-password.html`;
                    const { data, error } = await client.auth.resetPasswordForEmail(email, {
                        redirectTo: redirectTo
                    });

                    if (error) {
                        throw error;
                    }

                    showStatus(`Reset link sent successfully to ${email}! Kripya apna email inbox check karein aur link par click karein.`, 'success');
                    btnSendLink.textContent = 'Link Sent ✔';
                } catch (err) {
                    console.error('Password reset request error:', err);
                    let message = err.message || 'Reset link send karne mein error aaya.';
                    if (/rate limit/i.test(message)) {
                        message = 'Email rate limit exceed ho gaya hai. Kripya thoda wait karke dobara try karein.';
                    }
                    showStatus(`Error: ${message}`, 'error');
                    btnSendLink.disabled = false;
                    btnSendLink.textContent = 'Send Reset Link →';
                }
            });

            // ==========================================
            // ACTION 2: UPDATE PASSWORD
            // ==========================================
            updateForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (!newPassword || newPassword.length < 6) {
                    showStatus('Password must be at least 6 characters long.', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showStatus('Passwords match nahi ho rahe! Kripya dono fields check karein.', 'error');
                    return;
                }

                btnUpdatePassword.disabled = true;
                btnUpdatePassword.textContent = 'Updating password... ⏳';

                try {
                    const { data, error } = await client.auth.updateUser({
                        password: newPassword
                    });

                    if (error) {
                        throw error;
                    }

                    showStatus('Password successfully reset ho gaya hai! 🎉 Login page par redirect kiya ja raha hai...', 'success');

                    // Sign out to enforce clean login with new password
                    try {
                        await client.auth.signOut();
                    } catch (_) {}

                    setTimeout(() => {
                        window.location.href = 'auth.html?mode=login';
                    }, 1800);

                } catch (err) {
                    console.error('Update password error:', err);
                    showStatus(`Password update failed: ${err.message}`, 'error');
                    btnUpdatePassword.disabled = false;
                    btnUpdatePassword.textContent = 'Set New Password →';
                }
            });
        });
    </script>
</body>
</html>
